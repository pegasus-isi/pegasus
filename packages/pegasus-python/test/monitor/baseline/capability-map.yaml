    removed_flags: [--condor-poll, --no-condor-poll]
    compatibility_defaults:
      --interval/-i: 2.0 seconds
      --events/-e: 15
      --all-jobs/-a: false
      --sort-by-activity: true
      --log: 'WP7 optional value; omitted value selects auto path'
      --stop-server: 'WP7 optional value; omitted value selects auto PID file'
