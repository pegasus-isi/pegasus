version: "1.0.0"

# ── Policy mode ────────────────────────────────────────────────────────────────
# Active mode controls how aggressively the healer auto-applies fixes.
# Override at runtime with the HEALER_POLICY_MODE env var.
#
#   production  (default) — conservative: high confidence threshold, smaller
#                           multipliers, cost-impacting fixes require approval.
#   debug                 — aggressive: lower threshold, larger multipliers,
#                           more AUTO decisions for faster iteration.
#
mode: production

modes:
  production:
    confidence_threshold: 0.85
    failure_policies:
      OUT_OF_MEMORY:
        multiplier: 1.5
        maximum_attempts: 3
      DISK_EXCEEDED:
        multiplier: 2.0
        maximum_attempts: 2
      WALLTIME_EXCEEDED:
        decision: ASK          # cost implications — always ask in production
        multiplier: 1.5

  debug:
    confidence_threshold: 0.70  # accept lower-confidence diagnoses
    failure_policies:
      OUT_OF_MEMORY:
        multiplier: 2.0          # more aggressive memory bump
        maximum_attempts: 5
      DISK_EXCEEDED:
        multiplier: 3.0
        maximum_attempts: 4
      WALLTIME_EXCEEDED:
        decision: AUTO           # auto-apply in debug — no approval needed
        multiplier: 2.0
        maximum_attempts: 4
      TRANSIENT_INFRASTRUCTURE:
        maximum_attempts: 5

# ── Agent scope ────────────────────────────────────────────────────────────────
# Controls which files the agent may read and modify beyond the submit directory.
# Levels are hierarchical — each level includes everything from the levels below.
#
#   job      → submit dir only (generated by Pegasus: .sub, .dag, .lof, wrappers)
#   script   → job + transformation scripts (user-written code)
#   catalog  → script + replica & transformation catalogs
#   workflow → catalog + DAX / pegasus.properties (full pipeline definition)
#
# Override at runtime with AGENT_SCOPE_LEVEL in .env.
agent_scope:
  level: job                        # default: safest level

# ── Per-failure-type policy entries ───────────────────────────────────────────
# decision:       AUTO | ASK | STOP
# required_level: job | script | catalog | workflow
#   If the agent's scope level is below required_level the fix is blocked and
#   the fallback_decision is used instead.
# fallback_decision: decision to use when required_level is not met (default ESCALATE)

failure_policies:
  OUT_OF_MEMORY:
    action: INCREASE_MEMORY
    required_level: job           # only .sub request_memory change needed
    decision: AUTO
    multiplier: 1.5
    maximum_memory_mb: 524288     # 512 GB ceiling (NERSC Perlmutter node max)
    maximum_attempts: 3

  PARTITION_MIGRATION:
    # Triggered when OOM memory increase would exceed the current SLURM
    # partition's MaxMemPerNode ceiling.  The fix patches both request_memory
    # and batch_queue / +remote_queue to move the job to a larger partition.
    # Always ASK: partition changes affect cost, priority, and fair-share.
    action: MIGRATE_PARTITION
    required_level: job           # only .sub batch_queue + request_memory change
    decision: ASK
    fallback_decision: ASK        # suggest migration even when scope is tight
    maximum_attempts: 2           # if migration also OOMs, escalate

  DISK_EXCEEDED:
    action: INCREASE_DISK
    required_level: job           # only .sub request_disk change needed
    decision: AUTO
    multiplier: 2.0
    maximum_disk_mb: 1048576      # 1 TB ceiling
    maximum_attempts: 2

  WALLTIME_EXCEEDED:
    action: INCREASE_RUNTIME
    required_level: job           # only .sub request_runtime change needed
    decision: ASK                 # cost implications → require approval
    multiplier: 1.5
    maximum_runtime_seconds: 172800  # 48 h hard ceiling
    maximum_attempts: 2

  # ── Simple retry (no config change) ─────────────────────────────────────────

  PREEMPTED:
    # Job killed by a higher-priority job. Retry immediately without changes.
    # Detection: SLURM state=PREEMPTED, exit signal 15, scheduler reason "preempt".
    action: NO_ACTION_TRANSIENT_RETRY
    required_level: job
    decision: AUTO
    maximum_attempts: 5           # preemption can repeat; allow several retries

  NODE_FAILURE:
    # Hardware fault caused the node to go down mid-job.
    # Detection: SLURM state=NODE_FAIL, signal 9 without exit 137 (OOM).
    action: NO_ACTION_TRANSIENT_RETRY
    required_level: job
    decision: AUTO
    maximum_attempts: 3

  STAGING_FAILURE:
    # pegasus-transfer I/O error (network blip, NFS timeout, stale handle).
    # Detection: transformation name is stage_in/stage_out, or transfer error in stderr.
    action: NO_ACTION_TRANSIENT_RETRY
    required_level: job
    decision: AUTO
    maximum_attempts: 3

  MPI_FAILURE:
    # MPI rank communication failure — usually transient fabric issue.
    # Detection: stderr contains MPI_ABORT, Fatal error in PMPI_, etc.
    action: NO_ACTION_TRANSIENT_RETRY
    required_level: job
    decision: AUTO
    maximum_attempts: 2

  TRANSIENT_INFRASTRUCTURE:
    action: NO_ACTION_TRANSIENT_RETRY
    required_level: job           # no file change — just retry
    decision: AUTO
    maximum_attempts: 3

  # ── ASK — human approval required ────────────────────────────────────────────

  LICENSE_UNAVAILABLE:
    # Software license checkout failed (MATLAB, Gaussian, ANSYS, etc.).
    # Detection: stderr contains license/checkout-failed patterns, wall time short.
    # Fix: retry on site with available license, or wait for license to free.
    action: RETRY_DIFFERENT_SITE
    required_level: job
    decision: ASK
    fallback_decision: ASK
    maximum_attempts: 2

  GPU_UNAVAILABLE:
    # GPU not allocated or failed to initialise (CUDA error, no CUDA-capable device).
    # Detection: stderr contains CUDA error patterns, job exits very early.
    # Fix: retry on a GPU-capable site or reduce GPU request.
    action: RETRY_DIFFERENT_SITE
    required_level: job
    decision: ASK
    fallback_decision: ASK
    maximum_attempts: 2

  DATA_CORRUPTION:
    # Input file failed integrity/checksum check (pegasus-integrity mismatch).
    # Detection: stderr contains checksum mismatch, hash mismatch, corrupt.
    # Fix: re-stage the input from the replica catalog.
    action: RESTAGE_INPUT
    required_level: catalog       # needs replica catalog to re-stage
    decision: ASK
    fallback_decision: ASK
    maximum_attempts: 1

  SCRATCH_FULL:
    # Physical /tmp or scratch filesystem is full (not the Pegasus disk slot).
    # Detection: "No space left on device" on /tmp/scratch path in stderr.
    # Fix: redirect TMPDIR or clear scratch — human must intervene.
    action: HUMAN_REVIEW
    required_level: job
    decision: ASK
    fallback_decision: ESCALATE
    maximum_attempts: 1

  # ── ESCALATE — human must intervene, healer cannot fix ───────────────────────

  ACCOUNT_EXPIRED:
    # HPC allocation exhausted — job immediately rejected by scheduler.
    # Detection: scheduler reason + wall time near zero + account/allocation keywords.
    action: HUMAN_REVIEW
    required_level: job
    decision: ESCALATE
    maximum_attempts: 1

  CONTAINER_PULL_FAILED:
    # Docker/Singularity image missing or registry unreachable.
    # Detection: stderr from container runtime (FATAL: Unable to pull, etc.).
    action: HUMAN_REVIEW
    required_level: job
    decision: ASK               # propose fix path, human applies it
    fallback_decision: ESCALATE
    maximum_attempts: 1

  MODULE_NOT_FOUND:
    # Required environment module or binary not installed on execution site.
    # Detection: exit code 127, "module not found" / "command not found" in stderr.
    action: HUMAN_REVIEW
    required_level: job
    decision: ASK               # suggest site change, human decides
    fallback_decision: ESCALATE
    maximum_attempts: 1

  SSH_AUTH_FAILURE:
    # SSH authentication failure to remote execution site.
    # Detection: "Permission denied (publickey)" / "Host key verification failed" + exit 255.
    action: HUMAN_REVIEW
    required_level: job
    decision: ESCALATE          # credential fix requires human
    maximum_attempts: 1

  SCHEDULER_ADMISSION:
    action: CORRECT_SCHEDULER_CONFIG
    required_level: job           # fix requirements/accounting in .sub
    decision: ASK
    fallback_decision: ASK        # still suggest even if scope is insufficient
    maximum_attempts: 2

  MISSING_INPUT:
    action: CORRECT_DATA_BINDING
    required_level: catalog       # needs replica catalog access to fix bindings
    decision: ASK
    fallback_decision: ASK        # suggest the fix — human applies to catalog
    maximum_attempts: 1

  DATA_MISMATCH:
    action: FIX_DATA_BINDING
    required_level: catalog       # needs replica/transformation catalog
    decision: ASK
    fallback_decision: ASK        # suggest the fix — human applies to catalog
    maximum_attempts: 1

  SCRIPT_ERROR:
    action: PATCH_TRANSFORMATION_SCRIPT
    required_level: script        # needs access to user transformation scripts
    decision: ASK                 # script patches always require human approval
    fallback_decision: ASK        # suggest the patch — human applies it manually
    maximum_attempts: 1

  APPLICATION_ERROR:
    required_level: script        # investigation may require reading scripts
    decision: ASK
    fallback_decision: ASK        # suggest — human decides what to apply
    maximum_attempts: 2

  LOGIC_VALIDATION:
    required_level: workflow      # scientific logic lives in the pipeline definition
    decision: STOP                # never auto-fix scientific logic

  UNKNOWN:
    decision: ESCALATE

# ── Healer tags ───────────────────────────────────────────────────────────────
# Set per-job or per-transformation in the DAX/workflow.yml:
#   profiles:
#     pegasus:
#       healer_tags: "no-fix"
#
# Pegasus translates this to the .sub file as:
#   +PegasusHealerTags = "no-fix"
#
# Tags are checked before all other policy rules.
#
# no-fix     — diagnose only, never apply or suggest a fix
# stop       — if this job fails, abort the entire workflow
# stop-jobs  — if this job fails, stop all jobs of the same transformation family
healer_tags:
  no-fix:
    description: Diagnose only. No fix is proposed or applied.
    decision: STOP
  stop:
    description: Abort the entire workflow on failure.
    decision: STOP
    workflow_action: abort
  stop-jobs:
    description: Stop all jobs of the same transformation family on failure.
    decision: STOP
    workflow_action: stop_family

global:
  one_fix_per_attempt: true
  require_configuration_diff: true
  require_output_validation: true
  maximum_attempts: 5             # global fallback across all types
