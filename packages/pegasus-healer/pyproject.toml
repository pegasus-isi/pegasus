[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pegasus-healer"
version = "6.0.0.dev0"
description = "LLM-assisted job failure remediation for Pegasus WMS"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Pegasus Team", email = "pegasus@isi.edu" },
]
keywords = ["pegasus", "workflow", "htcondor", "remediation", "llm", "langgraph"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Distributed Computing",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "aiosqlite>=0.20.0",
    "litellm>=1.40.0",
    "instructor>=1.3.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
pegasus-healer = "Pegasus.healer.cli.healer:main"

[project.urls]
Homepage = "https://pegasus.isi.edu"
Repository = "https://github.com/pegasus-isi/pegasus"
Issues = "https://github.com/pegasus-isi/pegasus/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"Pegasus.healer" = ["healer.env.example"]
