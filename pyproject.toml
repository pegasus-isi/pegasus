[build-system]
requires = ["scikit-build-core>=1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "pegasus-wms"
version = "6.0.0.dev0"
description = "Pegasus Workflow Management System"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Pegasus Team", email = "pegasus@isi.edu" },
]
keywords = ["scientific workflows"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: Unix",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Java",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

dependencies = [
    # Core
    "PyYAML",
    "pythonsed",          # For profile expression
    "rich",               # Console/Markdown rendering for pegasus-analyzer
    # CLI / tools
    "click>=8.0",
    "pika",
    # Web service / dashboard
    "werkzeug<3.1.0",
    "Flask>=2.2,<3.0",
    "Flask-Caching",
    "requests",
    "pamela",
    # Database
    "sqlalchemy",
    "pymysql",
    # Note: there is no more worker-runtime Python dependency here.
    # boto3 (S3) and globus-sdk (Globus Online) were both dropped once
    # their respective tools (pegasus-s3/pegasus-transfer, then
    # pegasus-globus-online/-init) were rewritten in Go — see
    # packages/pegasus-transfer/CLAUDE.md for the decision record.
]

[project.urls]
Documentation = "https://pegasus.isi.edu/documentation/"
Repository = "https://github.com/pegasus-isi/pegasus"
Issues = "https://github.com/pegasus-isi/pegasus/issues"
Changes = "https://pegasus.isi.edu/blog/?category_name=Release"

[project.scripts]
# Main unified entry point
pegasus = "Pegasus.cli.main:cli"

# Backward-compatible legacy entry points
pegasus-status         = "Pegasus.cli.main:pegasus_status"
pegasus-run            = "Pegasus.cli.main:pegasus_run"
pegasus-analyzer       = "Pegasus.cli.main:pegasus_analyzer"
pegasus-statistics     = "Pegasus.cli.main:pegasus_statistics"
pegasus-remove         = "Pegasus.cli.main:pegasus_remove"
pegasus-plan           = "Pegasus.cli.main:pegasus_plan"
pegasus-version        = "Pegasus.cli.main:pegasus_version"
pegasus-rc-client      = "Pegasus.cli.main:pegasus_rc_client"
pegasus-tc-converter   = "Pegasus.cli.main:pegasus_tc_converter"
pegasus-rc-converter   = "Pegasus.cli.main:pegasus_rc_converter"
pegasus-sc-converter   = "Pegasus.cli.main:pegasus_sc_converter"
pegasus-aws-batch      = "Pegasus.cli.main:pegasus_aws_batch"
pegasus-monitord       = "Pegasus.cli.main:pegasus_monitord"
pegasus-dagman         = "Pegasus.cli.main:pegasus_dagman"
pegasus-db-admin       = "Pegasus.cli.main:pegasus_db_admin"
pegasus-exitcode       = "Pegasus.cli.main:pegasus_exitcode"
pegasus-graphviz       = "Pegasus.cli.main:pegasus_graphviz"
pegasus-init           = "Pegasus.cli.main:pegasus_init"
pegasus-metadata       = "Pegasus.cli.main:pegasus_metadata"
pegasus-preflight-check = "Pegasus.cli.main:pegasus_preflight_check"
pegasus-service        = "Pegasus.cli.main:pegasus_service"
pegasus-submitdir      = "Pegasus.cli.main:pegasus_submitdir"
pegasus-cwl-converter  = "Pegasus.cli.main:pegasus_cwl_converter"
pegasus-em             = "Pegasus.cli.main:pegasus_em"
pegasus-config         = "Pegasus.cli.main:pegasus_config"
pegasus-halt           = "Pegasus.cli.main:pegasus_halt"
pegasus-configure-glite = "Pegasus.cli.main:pegasus_configure_glite"

# C binaries (pegasus-kickstart, pegasus-cluster, pegasus-keg) and the Go
# pegasus-transfer / pegasus-checkpoint / pegasus-integrity /
# pegasus-globus-online / pegasus-globus-online-init binaries are installed
# directly to <venv>/bin/ by CMake via the wheel scripts section.
# pegasus-s3 has been retired; its S3 support was merged natively into
# pegasus-transfer. No Python wrapper console_scripts entries are needed.

[project.optional-dependencies]
all = ["pegasus-wms[mysql,postgresql,cwl]"]
postgresql = ["psycopg2"]
mysql = ["pymysql"]
cwl = ["cwl-utils>=0.11", "jsonschema>=3.2"]

[tool.scikit-build]
cmake.version = ">=3.20"
cmake.build-type = "Release"
build-dir = "_cmake_build"
editable.rebuild = true
wheel.py-api = "py3"

# Python package location — pegasus-python is the main package; pegasus-common
# and pegasus-api are merged into the wheel via CMake install(DIRECTORY) below.
wheel.packages = ["packages/pegasus-python/src/Pegasus"]

# Include non-git tracked files in the wheel and sdist (e.g., Java JARs, worker packages, etc.)
sdist.include = [
    "share/pegasus/java/**",
    "packages/pegasus-python/src/Pegasus/data/worker-packages/*.tar.gz",
]
sdist.exclude = [
    "**/*.o",
    "**/*.so",
    "**/*.class",
    "build/",
    "dist/",
    "_cmake_build/",
    "_cmake_build_worker/",
    ".claude/",
    ".agents/",
    ".github/"
]
